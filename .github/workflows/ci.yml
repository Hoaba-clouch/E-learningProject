name: CI / Lint, TypeCheck & Build Verification

on:
  push:
    branches: [main, master, dev, develop]
  pull_request:
    branches: [main, master, dev, develop]

jobs:
  ci-pipeline:
    name: 🚀 CI / Verification (Lint, TypeCheck & Build)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: ⚡ Run Lint Check (ESLint / Oxlint)
        run: npm run lint

      - name: 🎨 Check Code Formatting (Prettier / Oxfmt)
        run: npm run format:check

      - name: 🛡️ Verify TypeScript Types (TypeCheck)
        run: npm run typecheck

      - name: ⚡ Build Vite Production Artifact
        run: npm run build
